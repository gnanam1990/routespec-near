# RouteSpec gate action (composite). Runs the deterministic networkless RouteSpec gate for the
# checked-out subject and stages only redacted, scanned reports for upload.
#
# Security properties (ADR-0015):
# - every third-party action is pinned to a full commit SHA;
# - inputs reach the shell only through environment variables, never through an expression
#   inside a script;
# - the entry point withholds provider secrets and CI runtime tokens from everything it starts;
# - enforcement is CI_CHECK or REQUIRED_CHECK_UNVERIFIED, always unverified and never blocking;
# - the step exits 0 only for a PASS decision.
name: RouteSpec gate
description: Run a RouteSpec release gate in CI (simulate/replay only) and stage redacted reports.
inputs:
  config:
    description: Path of the routespec.ci-config/1 file, relative to the workspace.
    required: true
  node-version:
    description: Exact Node.js version used to run RouteSpec.
    required: false
    default: '22.23.1'
outputs:
  conclusion:
    description: success, failure, review_required, not_run, identity_mismatch, configuration_error, internal_error, or policy_denied.
    value: ${{ steps.gate.outputs.conclusion }}
  decision:
    description: Gate decision (PASS, FAIL, REVIEW, NOT_RUN) or NONE.
    value: ${{ steps.gate.outputs.decision }}
  exit-code:
    description: RouteSpec exit code.
    value: ${{ steps.gate.outputs.exit-code }}
  trust:
    description: Job trust (TRUSTED, PULL_REQUEST, FORK, UNTRUSTED).
    value: ${{ steps.gate.outputs.trust }}
  enforcement-mode:
    description: CI_CHECK or REQUIRED_CHECK_UNVERIFIED (never verified, never blocking).
    value: ${{ steps.gate.outputs.enforcement-mode }}
  artifact-ready:
    description: Whether the redacted evidence bundle was written (independent of the decision).
    value: ${{ steps.gate.outputs.artifact-ready }}
  upload-directory:
    description: Directory holding only the staged, scanned upload files and upload-manifest.json.
    value: ${{ steps.gate.outputs.upload-directory }}
  retention-days:
    description: Bounded retention for the uploaded artifact.
    value: ${{ steps.gate.outputs.retention-days }}
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
      with:
        node-version: ${{ inputs.node-version }}
    - name: Install pinned RouteSpec dependencies
      shell: bash
      env:
        ROUTESPEC_ACTION_ROOT: ${{ github.action_path }}/../../..
      run: |
        cd "$ROUTESPEC_ACTION_ROOT"
        corepack enable
        pnpm install --frozen-lockfile
    - name: Run RouteSpec gate
      id: gate
      shell: bash
      env:
        ROUTESPEC_ACTION_ROOT: ${{ github.action_path }}/../../..
        ROUTESPEC_CI_CONFIG: ${{ inputs.config }}
      run: node --no-warnings "$ROUTESPEC_ACTION_ROOT/packages/ci/bin/routespec-ci.mjs" run --config "$ROUTESPEC_CI_CONFIG"
