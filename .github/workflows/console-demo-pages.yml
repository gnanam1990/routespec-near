# Deploys the static read-only console demo to GitHub Pages (M54). Manual only: the repository
# owner starts it from the Actions tab. The site is the console built in demo mode plus the
# committed recording of a real contained run (`packages/distribution/console-demo/`); this job
# records nothing and contacts no RouteSpec service. The build refuses a recording whose digests
# do not match its provenance file.
name: console-demo-pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: console-demo-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22.23.1'
      - name: Install pinned dependencies
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Build the demo site
        shell: bash
        run: pnpm run demo:console -- --out site --base /routespec-near/
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
